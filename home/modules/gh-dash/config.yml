prSections:
  - title: My Pull Requests
    filters: is:open author:@me
  - title: Needs My Review
    filters: is:open review-requested:@me
  - title: Involved
    filters: is:open involves:@me -author:@me

issuesSections:
  - title: My Issues
    filters: is:open author:@me
  - title: Assigned
    filters: is:open assignee:@me
  - title: Involved
    filters: is:open involves:@me -author:@me

defaults:
  preview:
    open: true
    width: 55

keybindings:
  prs:
    # d: diffview で差分表示
    - key: d
      command: >
        cd {{.RepoPath}} &&
        git fetch origin pull/{{.PrNumber}}/head:pr-{{.PrNumber}} 2>/dev/null &&
        git checkout pr-{{.PrNumber}} 2>/dev/null &&
        nvim -c 'DiffviewOpen origin/{{.BaseRefName}}...HEAD'
    # C: Octo でレビュー開始
    - key: C
      command: >
        cd {{.RepoPath}} &&
        nvim -c 'Octo pr edit {{.PrNumber}}' -c 'Octo review start'
