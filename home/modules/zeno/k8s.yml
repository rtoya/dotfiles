completions:
  # namespace completion
  - name: kubectl namespace
    patterns:
      - "^kubectl .* -n $"
      - "^k .* -n $"
    sourceCommand: "kubectl get namespaces -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\\n'"
    options:
      --prompt: "'Namespace> '"

  # pod completion
  - name: kubectl pod
    patterns:
      - "^kubectl (logs|describe pod|exec|port-forward) $"
      - "^kubectl (logs|describe pod|exec|port-forward) .* -n [a-z0-9-]+ $"
    sourceCommand: "kubectl get pods --no-headers -o custom-columns=':metadata.name'"
    options:
      --prompt: "'Pod> '"
      --preview: "kubectl describe pod {}"

  # deployment completion
  - name: kubectl deployment
    patterns:
      - "^kubectl (describe deployment|scale deployment|rollout .* deployment) $"
    sourceCommand: "kubectl get deployments --no-headers -o custom-columns=':metadata.name'"
    options:
      --prompt: "'Deployment> '"

  # context completion
  - name: kubectl context
    patterns:
      - "^kubectl ctx $"
    sourceCommand: "kubectl config get-contexts -o name"
    options:
      --prompt: "'Context> '"
